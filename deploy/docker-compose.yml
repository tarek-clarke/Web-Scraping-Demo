services:
  rap-cuda:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.cuda
      args:
        CUDA_VERSION: ${CUDA_VERSION:-13.3.0}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
    image: resilient-rap:cuda-${CUDA_VERSION:-13.3.0}-ubuntu${UBUNTU_VERSION:-24.04}
    container_name: rap-cuda
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../configs:/app/configs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["run_matrix.py"]
    restart: unless-stopped

  rap-rocm:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.rocm
      args:
        ROCM_VERSION: ${ROCM_VERSION:-7.2.4}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        PYTORCH_VERSION: ${PYTORCH_VERSION:-2.10.0}
    image: resilient-rap:rocm-${ROCM_VERSION:-7.2.4}-ubuntu${UBUNTU_VERSION:-24.04}
    container_name: rap-rocm
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../configs:/app/configs:ro
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined
    command: ["run_matrix.py"]
    restart: unless-stopped

  rap-cpu:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.cpu
    image: resilient-rap:cpu-ubuntu${UBUNTU_VERSION:-24.04}
    container_name: rap-cpu
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../configs:/app/configs:ro
    command: ["run_matrix.py"]
    restart: unless-stopped

  ingestion:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.cpu
    image: resilient-rap:cpu-ubuntu${UBUNTU_VERSION:-24.04}
    container_name: rap-ingestion
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../data:/app/data
    working_dir: /app/go/ingestion
    command: ["sh", "-c", "go run main.go"]
    restart: "no"
