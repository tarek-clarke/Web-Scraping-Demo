# =============================================================================
#  Telemetry Platform Telemetry Spine — Docker Compose (Production)
# =============================================================================
#  Developed for the 2026 Telemetry Platform Initiative.
#  Enterprise deployment configuration per Chris Green's review.
#
#  Services:
#    telemetry-spine  — Core pipeline (circuit breaker, edge buffer, geo-fence)
#    health-monitor   — Pit Wall CLI dashboard
#    stress-test      — Triple-header validation runner
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Core Telemetry Pipeline
  # ---------------------------------------------------------------------------
  telemetry-spine:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: telemetry_telemetry_spine
    restart: unless-stopped

    environment:
      - PYTHONPATH=/app
      - TELEMETRY_ENV=production
      - LOG_LEVEL=INFO
      # Data sovereignty: set the deployment region
      - DEPLOYMENT_REGION=US
      - WAR_ROOM_SYNC_ENABLED=true

    volumes:
      # Persistent data volume — survives container restarts
      - telemetry-data:/app/data
      # Outputs volume — reports, CSVs, logs
      - telemetry-outputs:/app/outputs
      # Read-only code mount (optional, for prod use the baked-in image)
      # - ./:/app:ro

    networks:
      - telemetry-internal

    # Resource limits — budget cap discipline
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M

    healthcheck:
      test: ["CMD", "python", "-c", "from modules.base_ingestor import BaseIngestor; print('OK')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    command: ["main.py", "--adapter", "openf1", "--session", "9158", "--driver", "1"]

  # ---------------------------------------------------------------------------
  # Health Monitor (Pit Wall Dashboard)
  # ---------------------------------------------------------------------------
  health-monitor:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: telemetry_health_monitor
    restart: "no"

    environment:
      - PYTHONPATH=/app
      - TERM=xterm-256color

    volumes:
      - telemetry-data:/app/data:ro
      - telemetry-outputs:/app/outputs:ro

    networks:
      - telemetry-internal

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

    security_opt:
      - no-new-privileges:true

    command: ["tools/health_monitor.py", "--duration", "60"]
    depends_on:
      telemetry-spine:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Triple-Header Stress Test
  # ---------------------------------------------------------------------------
  stress-test:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: telemetry_stress_test
    restart: "no"

    environment:
      - PYTHONPATH=/app

    volumes:
      - telemetry-data:/app/data
      - telemetry-outputs:/app/outputs

    networks:
      - telemetry-internal

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

    security_opt:
      - no-new-privileges:true

    command: ["tools/telemetry_stress_test.py", "--packets", "2000", "--chaos", "0.15"]

# =============================================================================
# Shared Infrastructure
# =============================================================================
volumes:
  telemetry-data:
    driver: local
    labels:
      com.telemetry.purpose: "telemetry-persistence"
  
  telemetry-outputs:
    driver: local
    labels:
      com.telemetry.purpose: "telemetry-outputs-reports"

networks:
  telemetry-internal:
    driver: bridge
    labels:
      com.telemetry.purpose: "internal-pipeline-network"
