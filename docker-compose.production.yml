# =============================================================================
#  Telemetry Pipeline — Multi-Car Team Testing (Concurrency)
# =============================================================================
#  This configuration runs two parallel telemetry pipelines (Car 1 & Car 2)
#  on a single shared GPU to validate multi-tenant resilience.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Car 1 Pipeline
  # ---------------------------------------------------------------------------
  car-1-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: rap_car_1_spine
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - TELEMETRY_ENV=production
      - DRIVER_ID=1
      - SESSION_ID=TEAM_TEST_01
    volumes:
      - car-1-data:/app/data
      - car-1-outputs:/app/outputs
    networks:
      - telemetry-team-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    # GPU Passthrough (NVIDIA/AMD)
    # devices:
    #   - /dev/kfd:/dev/kfd
    #   - /dev/dri:/dev/dri

  # ---------------------------------------------------------------------------
  # Car 2 Pipeline
  # ---------------------------------------------------------------------------
  car-2-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: rap_car_2_spine
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - TELEMETRY_ENV=production
      - DRIVER_ID=2
      - SESSION_ID=TEAM_TEST_01
    volumes:
      - car-2-data:/app/data
      - car-2-outputs:/app/outputs
    networks:
      - telemetry-team-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

# =============================================================================
# Isolated Volumes per Car
# =============================================================================
volumes:
  car-1-data:
  car-1-outputs:
  car-2-data:
  car-2-outputs:

networks:
  telemetry-team-net:
    driver: bridge
