name: Domain Agnosticism Test

on:
  workflow_dispatch:
    inputs:
      api_endpoint:
        description: 'API endpoint to test against'
        required: true
        type: string
      domain_name:
        description: 'Domain name (e.g., automotive, healthcare, aerospace)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run domain agnosticism test
        env:
          API_ENDPOINT: ${{ github.event.inputs.api_endpoint }}
          DOMAIN_NAME: ${{ github.event.inputs.domain_name }}
          PYTHONPATH: "."
        run: |
          mkdir -p docs/data/domain-tests
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FILENAME="docs/data/domain-tests/${DOMAIN_NAME}-${TIMESTAMP}.json"
          
          echo "Testing domain: $DOMAIN_NAME"
          echo "API Endpoint: $API_ENDPOINT"
          
          # Run pytest and capture result
          echo "Running pytest..."
          pytest tests/ -v --tb=short --timeout=120 -x > /tmp/test_output.txt 2>&1
          TEST_RESULT=$?
          
          TEST_OUTPUT=$(head -20 /tmp/test_output.txt)
          
          # Create JSON result file
          cat > "$FILENAME" << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "api_endpoint": "$API_ENDPOINT",
            "domain_name": "$DOMAIN_NAME",
            "commit_sha": "${{ github.sha }}",
            "commit_ref": "${{ github.ref }}",
            "status": $([ $TEST_RESULT -eq 0 ] && echo '"passed"' || echo '"failed"'),
            "exit_code": $TEST_RESULT,
            "test_output": "pytest execution completed"
          }
          EOF
          
          echo "Results saved to: $FILENAME"
          cat "$FILENAME"

      - name: Commit results to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/domain-tests/ || true
          git commit -m "test: domain agnosticism results for ${{ github.event.inputs.domain_name }}" --allow-empty || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main || echo "Push failed (may be OK)"
