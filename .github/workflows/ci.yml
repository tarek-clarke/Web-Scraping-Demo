# Resilient RAP Framework — CI Pipeline
# Runs on every push and PR to validate the full pipeline.

name: CI — Tests & Stress

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit + Integration Tests ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (flake8)
        run: |
          flake8 src/ tests/ --max-line-length 120 --count --show-source --statistics

      - name: Run test suite
        env:
          PYTHONPATH: "."
        run: |
          pytest tests/ -v --tb=short --timeout=120

  # ── Stress Test (chaos injection) ───────────────────────────────────
  stress:
    runs-on: ubuntu-latest
    needs: test                 # only stress-test if unit tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Stress test — 1 000 packets, 15% chaos
        env:
          PYTHONPATH: "."
        timeout-minutes: 10
        run: |
          timeout 300 python tools/telemetry_stress_test.py --packets 1000 --chaos 0.15

      - name: Upload stress-test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: |
            data/stress_*.csv
            data/stress_*.json
          retention-days: 30

  # ── Docker build smoke test ─────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t resilient-rap:ci .

      - name: Verify container starts
        run: |
          docker run --rm resilient-rap:ci python -c "from src.circuit_breaker import TelemetryCircuitBreaker; print('OK')"
