# Quantum Router Configuration
# Used by src/routing/quantum_router.py

router:
  mode: vqc               # vqc | qaoa | hybrid
  backend: aer_simulator   # aer_simulator | ibm_quantum | lumi_q
  shots: 1024
  feature_count: 10
  enable_gemma: false      # Disabled — too slow on MI250X (~800ms/packet)
  reconcilers:             # Default active routing targets
    - levenshtein
    - regex
    - bert

vqc:
  feature_map: ZZFeatureMap
  ansatz: RealAmplitudes
  reps: 2
  optimizer: COBYLA
  maxiter: 200

qaoa:
  depth: 2
  accuracy_threshold: 0.7

backends:
  aer_simulator: {}
  ibm_quantum:
    channel: ibm_quantum
    instance: ibm-q/open/main
  lumi_q:
    endpoint: null         # Set when LUMI-Q access is granted via FiQCI
    qubits: 53             # VTT Q50
