# Generic HPC Slurm template for NVIDIA L40 / RTX 4090-class nodes
# Use with: sbatch configs/slurm/l40.conf

#SBATCH --job-name=rap-l40
#SBATCH --partition=gpu
#SBATCH --gres=gpu:1
#SBATCH --cpus-per-task=12
#SBATCH --mem=96G
#SBATCH --time=08:00:00
#SBATCH --output=outputs/slurm/%x-%j.out
#SBATCH --error=outputs/slurm/%x-%j.err

module purge

if [ -n "${GCC_MODULE:-}" ]; then
    module load "$GCC_MODULE"
fi

source ./init_phd_env.sh
micromamba run -n rap-env -- ./tools/run_all_benchmarks.sh L40