job:
  name: rap-a100
  partition: gpu
  gres: gpu:1
  cpus_per_task: 16
  mem: 128G
  time: "08:00:00"
  output: outputs/slurm/%x-%j.out
  error: outputs/slurm/%x-%j.err

hardware:
  gpu: A100
  torch_cuda_arch_list: "8.0"
  notes: "Scale RAM/CPU requests to the node image; keep the ratio proportional to the benchmark workload."

bootstrap:
  env_script: ./init_phd_env.sh
  activate: "micromamba run -n rap-env -- ./tools/run_all_benchmarks.sh A100"